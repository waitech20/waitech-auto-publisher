name: WaiTech Auto Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no real Facebook post, no database write)"
        required: false
        default: "false"

concurrency:
  group: waitech-auto-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run publisher
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BLOGGER_RSS: ${{ secrets.BLOGGER_RSS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node src/index.js

      - name: Persist publication database
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if ! git diff --quiet -- data/published.json; then
            git config user.name "waitech-auto-publisher-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/published.json
            git commit -m "chore: update publication database [skip ci]"
            git push
          else
            echo "No database changes to commit."
          fi
